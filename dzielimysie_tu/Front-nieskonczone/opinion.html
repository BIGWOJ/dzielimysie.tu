<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oferta - Wyprowadzanie psa</title>
  <link rel="stylesheet" href="style/header.css">
  <link rel="stylesheet" href="style/footer.css">
  <link rel="stylesheet" href="style/opinion.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <header>
    <nav>
      <ul>
        <li><a href="offers.html">Oferty</a></li>
        <li><a href="ulubione.html">Ulubione</a></li>
        <li><a href="message.html">Wiadomości</a></li>
      </ul>
      <button class="add-offer">Dodaj ogłoszenie</button>
      <button class="account">Moje konto</button>
    </nav>
  </header>

  <div class="container">
    <div class="opinion">
      <h2>WYSTAW OPINIĘ</h2>
      <p>OGŁOSZENIE</p>
      <div class="chat-description">
        <img class="chat-img" src="images/pies.jpg" alt="pies">
        <div class="offer-info">
          <span class="offer-text">Wyprowadzenie psa Szczecin, śródmieście</span>
          <span class="offer-price">10zł</span>
        </div>
      </div>

      <div class="stars">
        <i class="fa-regular fa-star"></i>
        <i class="fa-regular fa-star"></i>
        <i class="fa-regular fa-star"></i>
        <i class="fa-regular fa-star"></i>
        <i class="fa-regular fa-star"></i>
      </div>

      <textarea placeholder="Napisz opinię na temat tego ogłoszenia..."></textarea>
      <button class="accept">ZATWIERDŹ</button>
    </div>

    <div class="user">
      <img src="images/Avatar.png" alt="Profil">
      <p class="username">Si_woo_111</p>
      <button class="go-to-profile">PRZEJDŹ DO PROFILU</button>
      <h3>OSTATNIE OPINIE</h3>
    </div>
  </div>

  <footer>
    <p>© 2024 dzielimysie.tu</p>
  </footer>
</body>
</html>
