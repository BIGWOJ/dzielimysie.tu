{%extends 'main.html'%}
{%block content%}

<img src="{{user.avatar.url}}" style="width: 100px; height: 100px;"><br>
{{user.username}}
<!-- https://docs.djangoproject.com/en/5.1/ref/templates/builtins/#date -->
<p>Na platformie od {{user.date_joined|date:"E Y"}}</p>

<a href="{%url 'user_offers_page' user.id%}">
    <p href=>Ogłoszenia</p>
</a>

<a href="{%url 'user_profile_page' user.id%}">
    <p>Opinie</p>
</a>


{%for offer in offers%}
<a href="{%url 'offer_page' offer.id%}">
    <img src="{{offer.photo_set.first.photo.url}}" style="width: 200px; height: 200px;">
</a>
<p>{{offer.title}}</p>
<p>{{offer.price}}</p>
{%endfor%}

{%endblock content%}
