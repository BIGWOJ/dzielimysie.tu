<h1>Chat Room</h1>
<ul>
    {% for message in messages %}
    <li>
       <b>{{ message.author.username }}</b> ({{ message.timestamp }}): {{ message.content }}
    </li>
    {% endfor %}
</ul>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send</button>
</form>
