<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oferta - Wyprowadzanie psa</title>
    <link rel="stylesheet" href="style/header.css">
    <link rel="stylesheet" href="style/footer.css">
    <link rel="stylesheet" href="style/style_chat.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="offers.html">Oferty</a></li>
                <li><a href="#">Ulubione</a></li>
                <li><a href="message.html">Wiadomości</a></li>
            </ul>
            <button class="add-offer"><a href="add_offer.html">Dodaj ogłoszenie</a></button>       
            <button class="account">Moje konto</button>           
        </nav>
    </header>
        <div class="chat-container">
            <div class="chat-main">
                <div class="chat-header">
                    <img class="profile-pic" src="images/Avatar.png" alt="Użytkownik">
                    <h2 class="username">Si_woo_111</h2>
                    <p class="chat-topic">Rozmawiasz odnośnie:</p> 
                    <div class="chat-description">
                        <img class="chat-img" src="images/pies.jpg" alt="pies">
                        <span class="offer-text">Wyprowadzenie psa Szczecin, śródmieście</span>
                        <span class="offer-price">10zł</span>
                    </div>                     
                </div> 
                          
                <div class="chat-messages">
                    <p class="message sent">Cześć, chciałem dopytać o usługę dla psa.</p>
                    <p class="message received">Cześć, oczywiście wyprowadzam psy. Zapraszam do rozmowy.</p>
                    <p class="message sent">Okej, zgoda.</p>
                </div>
                <div class="chat-input">
                    <input type="text" placeholder="Wpisz wiadomość...">
                    <button class="send-btn">➤</button>
                </div>
            </div>
        </div>
    <footer>
        <p>© 2024 dzielimysie.tu</p>
    </footer>
</body>
</html>
