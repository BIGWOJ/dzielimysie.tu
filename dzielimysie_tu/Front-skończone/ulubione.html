<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oferta - Wyprowadzanie psa</title>
    <link rel="stylesheet" href="style/header.css">
    <link rel="stylesheet" href="style/footer.css">
    <link rel="stylesheet" href="style/ulubione.css">
    
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="offers.html">Oferty</a></li>
                <li><a href="ulubione.html">Ulubione</a></li>
                <li><a href="message.html">Wiadomości</a></li>
            </ul>
            <button class="add-offer"><a href="add_offer.html">Dodaj ogłoszenie</a></button>
            <button class="account">Moje konto</button>           
        </nav>
    </header>
    <div class="container">
        <div class="search-container">
            <input type="text" placeholder="Szukaj...">
            <button><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M21.71 20.29l-5.4-5.39a8 8 0 10-1.41 1.41l5.39 5.4a1 1 0 001.42-1.42zM4 10a6 6 0 116 6 6 6 0 01-6-6z"/>
            </svg></button>
        </div>
        <div class="filters">
            <button class="filter active"><a href="ulubione.html">Ogłoszenia</a></button>
            <button class="filter"><a href="ulubione_użytk.html">Użytkownicy</a></button>
          </div>
        
          <main class="ads-grid">
            <div class="ad">
              <img src="images/szczeniaki.jpg" alt="Szczeniaki" />
              <h3>Oddam szczeniaki</h3>
              <p class="price free">Za darmo</p>
            </div>
            <div class="ad">
              <img src="images/liście.jpg" alt="Grabienie liści" />
              <h3>Zgrabianie</h3>
              <p class="price">Za darmo</p>
            </div>
            <div class="ad">
                <img src="images/paczkomat.jpg" alt="Paczkomat" />
                <h3>Odbiór paczki</h3>
                <p class="price">5zł</p>
              </div>
              <div class="ad">
                <img src="images/zabawka.jpeg" alt="Zabawki" />
                <h3>Oddam zabawki</h3>
                <p class="price">Za darmo</p>
              </div>
            <div class="ad placeholder large">
              <div class="image-placeholder"></div>
              <h3>Twoje ulubione ogłoszenie</h3>
              <p class="price">0</p>
            </div>
    </div>
    <footer>
        <p>© 2024 dzielimysie.tu</p>
    </footer>
<script src="offers.js"></script>
</body>
</html>
