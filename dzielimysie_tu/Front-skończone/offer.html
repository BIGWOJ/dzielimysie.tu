<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oferta - Wyprowadzanie psa</title>
    <link rel="stylesheet" href="style/header.css">
    <link rel="stylesheet" href="style/footer.css">
    <link rel="stylesheet" href="style/style_offer.css">
    <script src="script_offer.js"></script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Oferty</a></li>
                <li><a href="#">Ulubione</a></li>
                <li><a href="#">Wiadomości</a></li>
            </ul>
            <button class="add-offer">Dodaj ogłoszenie</button>
            <button class="account">Moje konto</button>           
        </nav>
    </header>
    <div class="container">
        <div class="offer-container">
            <div class="image">
                <img id="dogImage" src="images/pies.jpg" alt="Zdjęcie psa" onclick="changeImage()">
            </div>
           
            <div class="details">              
                <h1>Wyprowadzanie psa</h1>
                <span class="category">Usługi</span>
                <p class="price">10 zł</p>
                <p class="location">Szczecin, Śródmieście</p>
                <div class="buttons">
                    <button class="apply">Zgłoś się</button>
                    <a href="message.html" class="message">Napisz wiadomość</a>
                </div>
                <div class="description">
                    <h3>Opis</h3>
                    <p>Potrzebuję chętnej osoby do wyprowadzania psa przez następny tydzień.</p>
                </div>
            </div>
            <div class="user-profile">
                <img src="images/Avatar.png" alt="Profil użytkownika">
                <p>Si_woo_111</p>
            </div> 
        </div>
    </div>
    <footer>
        <p>© 2024 dzielimysie.tu</p>
    </footer>
</body>
</html>
